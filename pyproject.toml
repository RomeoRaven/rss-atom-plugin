[project]
name = "protoagent-rss-atom"
version = "0.3.0"
description = "Safe durable RSS and Atom intake for protoAgent."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
